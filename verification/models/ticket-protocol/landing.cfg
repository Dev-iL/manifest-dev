\* Every way a landing can fail to merge: a moved head, a moved base, a red check, a required review, a closed pull request.
CONSTANTS Orchs = {o1}
          Env = {"push", "base", "red", "review", "prclose"}
          PreFix = FALSE
          MaxRuns = 7
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
INVARIANTS OneAttemptRecord ClosedOnlyWhenLanded NoLandWhileEscalated
PROPERTIES ReadyResolves PushesBuildOnHead MergesOnlyRecordedHead
